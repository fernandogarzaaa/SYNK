[package]
name = "synk-shell"
version = "0.1.0"
description = "SYNK Native Shell for Human-Agent Browser Runtime"
authors = ["Fernando Garza <garza@inan.ai>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1.5", features = ["dialog-ask", "dialog-confirm", "dialog-message", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
